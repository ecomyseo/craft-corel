welcome.news.more = "もっと詳しく知りたいですか？" # mt
welcome.news.v0_32_body = "画像をトレースすると、ずっと少ないオブジェクトで元の画像によく似た結果になります。クイックトレースが使う新しい「最適化」設定は、画像ごとにちょうどよい細かさを自動で選びます。macOS では、Finder で図面をダブルクリックすると Craft Corel で開きます。パネルのタブはドラッグで並べ替えられ、変形はページのどこからでも始められます。Android では印刷と共有がシステムを通して行われます。ブラウザーや Android で追加したフォントは次回も使えます。" # mt
welcome.news.v0_32_title = "より賢いトレース" # mt
welcome.news.v0_33_body = ".cdr として保存するとガイドラインが残り、段落テキストも本当の段落テキストとして保存されるため、ファイルを開き直したときにどちらも元どおりになります。Android では AI 描画や辞書のダウンロードなどのオンライン機能が使えるようになり、テキストツールでタップすると画面キーボードが表示され、どの言語でもページに直接入力できます。トレースした画像は色と色の間にすき間なく組み合わさり、ノードの削減は曲線の形を忠実に保ち、Linux ではスクリーンショットが一度で貼り付けられます。" # mt
welcome.news.v0_33_title = ".cdr 保存の改善と Android のオンライン機能" # mt
welcome.news.v0_34_body = "Craft Corel は GitHub 上の独自の組織に移りました。プロジェクト、ダウンロード、ブラウザー版へのリンクはすべて新しいアドレスを指します。バージョン情報とインストーラーには Craft Corel のメンバーと貢献者の名前が載り、短い注意書きで Craft Corel が独立したプロジェクトであることを明記しています。壊れた PDF ファイルを開いてもプログラムが閉じなくなり、貢献者向けにはプロジェクトの運営方法がよりわかりやすくまとめられました。" # mt
welcome.news.v0_34_title = "プロジェクトの新しい拠点" # mt
welcome.news.v0_35_body = "作業環境のビジュアルの刷新が本格的に登場しました。ひとつのすっきりしたスタイルで描かれた新しいツールボックスのアイコン、わかりやすい色名の新しい標準カラーパレット、ステータスバーの短くはっきりしたヒント、そしてより簡単な名前のメニューバー（ファイル、編集、表示、オブジェクト、テキスト、イメージ、効果、ページ、ツール、ウィンドウ、ヘルプ）です。Craft Corel の図面を別の図面に読み込めるようになり、Tab キーで数値欄から次の数値欄へ直接移動でき、マルチページ表示ではどのページにもそのページのガイドラインが表示されます。スペースキーを押し続けても余分なコピーが残らなくなり、Alt キーを押しながらクリックすると、ほかの図形の後ろに隠れた図形を 1 回で選べます。" # mt
welcome.news.v0_35_title = "新しい見た目" # mt
welcome.news.v0_36_body = "このバージョンで Craft Corel はずっと落ちにくくなりました。さまざまな種類の壊れたファイルは、プログラムを閉じるのではなく、受け付けないか安全に開くようになり、とても深く入れ子になったグループを持つ図面も再び開けます。可変アウトラインは閉じた図形のまわりを一周し、シェイプツールで範囲を囲んでノードを選ぶ操作は、ほかのオブジェクトの上でも期待どおりに動きます。グループ解除、分解、ナイフは、中身の入った枠を中身を失わずに分けます。角の丸い輪郭はなめらかになり、コマンドに割り当てたショートカットは以前そのキーを持っていたコマンドから外され、印刷プレビューは角からページを均等に拡大縮小します。" # mt
welcome.news.v0_36_title = "より安定し、より正確に" # mt
welcome.news.v0_37_body = "作業環境のビジュアルの刷新により、通常サイズでもくっきり見える、細く軽やかなツールアイコンになりました。フローティングのツールボックスはサイズを変えられ、ボタンが収まるように並び直します。Ctrl を押しながらマウスホイールを回すと、パレットの色見本やツールバーのボタンが大きくも小さくもなります。テキスト入力中でもズームのショートカットが使え、消しゴムは枠の中に入れた図形にも効き、表の行と列はプロパティバーから変えられます。数値欄の上でホイールを回しても元に戻すの一覧が埋まらなくなり、クリップアートのトレースはよりきれいになり、macOS では終了するときに保存していない作業を失う前に確認します。" # mt
welcome.news.v0_37_title = "くっきりしたアイコンとなめらかな編集" # mt
welcome.news.v0_38_body = "複数のカラーパレットを同時に開けるようになりました。それぞれが専用のバーに入り、ウィンドウのどの端にもドッキングでき、フローティングにもできます。パレットマネージャーもわかりやすいレイアウトになりました。作業環境のビジュアルの刷新も続いています。ツールボックスとツールバーのアイコンが、選んだボタンサイズに合わせて 5 段階で大きくなります。段落テキストは枠のサイズを変えている間に流し直され、変形のハンドルが見やすくなり、マルチページ表示ではページの間隔を選べます。.cdr ファイルのグラデーションや半透明のオブジェクトは作られたとおりに開き、PDF ファイルはトンボ、特色、クリップされた図形を保ちます。" # mt
welcome.news.v0_38_title = "複数のパレットを同時に" # mt
welcome.news.v0_39_body = "ブラウザーでは、ペンタブレットのペンで押す強さに合わせて太い線や細い線が描けます。Linux では、ファイルマネージャーからウィンドウへのファイルのドラッグが再びできるようになりました。自分だけのカラーパレットを作り、それぞれを専用のバーに表示できます。星形は内側に反転させることができ、四角形の角丸は余裕があればずっと大きくでき、グレースケールや CMYK のビットマップへの変換では本当にその種類の画像になります。エンベロープやグラデーションを使った .cdr ファイルは元の見た目により近くなり、Windows ではインストーラーが Craft Corel の表示言語をたずねます。" # mt
welcome.news.v0_39_title = "ブラウザーでの筆圧と自分だけのパレット" # mt
welcome.news.v0_40_body = "TraceCut はカッティングプロッター向けの新しいウィンドウです。図面をプロッターに送り、カットラインを加え、材料を節約するためにシートやロールに図形を配置し、寸法を測れます。メニューとリストがキーボードで操作できるようになりました。Android のスマートフォンでは画面に収まるインターフェースになり、ペンを使っている間は画面に置いた手で描画されなくなりました。Linux の Wayland でペンタブレットのペンが使えます。.cdr ファイルはタブ位置、マスターページ、グラデーション、変形を保って開き、保存したテキスト入りの .cdr ファイルがほかのプログラムで再び開けるようになりました。PDF ファイルの画像はフル解像度で読み込まれ、JPEG と TIFF は CMYK で書き出せ、画像は元の形式のまま保存でき、多くのツールが改善されました。" # mt
welcome.news.v0_40_title = "カッティングプロッター向けの TraceCut" # mt
welcome.news.v0_41_body = "タッチスクリーンでは Shift、Ctrl、Alt のボタンで、キーを押し続けたときと同じ操作を指でできます。Alt のショートカットは幅の狭いウィンドウでもすべてのメニューを開きます。Android ではインターフェースがカメラの切り欠きや角の丸みを避け、データマージで画像のフォルダーを使えます。ブラウザーでは iPad の Safari で Apple Pencil が使え、WebP を非可逆で保存してファイルを小さくできます。.cdr ファイルは重なった曲線の塗りつぶし規則を保つので、トレースした文字に白いすき間が出なくなり、タブ位置、段組みのテキスト、全ページ共通のガイドライン、マスターページのオブジェクトを保って開きます。読み込んだファイルはカーソルで配置でき、繰り返しで一連の操作をまとめて繰り返せ、B スプラインの点を固定または浮動にできます。画像のピクセルをトリミングでき、グレースケールや逆順で、プリンターの実際の余白内に印刷でき、CMYK 画像は透明度を保ちます。スクロールバーを隠せ、パレットの色を画像から取り込め、Windows ではタイトルバーがダークテーマに従います。" # mt
welcome.news.v0_41_title = "タッチ用キー、.cdr ファイルの改善、画像のトリミング" # mt
