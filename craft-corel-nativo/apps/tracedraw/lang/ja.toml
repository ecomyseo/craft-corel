# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "オブジェクトをクリックすると選択されます。周りに 8 つのハンドルが表示されます。" # mt
hintstep.pick.2 = "オブジェクトをドラッグすると移動します。角のハンドルをドラッグすると縦横比を保ってサイズ変更、辺のハンドルをドラッグすると伸縮します。" # mt
hintstep.pick.3 = "選択中のオブジェクトをもう一度クリックすると回転ハンドルが表示されます。角の矢印をドラッグすると回転、辺の矢印をドラッグすると傾斜します。" # mt
hintstep.pick.4 = "何もない場所からオブジェクトを囲むように枠をドラッグすると、枠の中に完全に入ったオブジェクトがすべて選択されます。" # mt
hintstep.pick.5 = "Shift+クリックで選択に追加または解除、Ctrl+クリックでグループ内のオブジェクトを選択、Alt+クリックで下にあるオブジェクトを選択します。" # mt
hintstep.freehand_pick.1 = "選択したいオブジェクトを囲むようにループをドラッグします。ボタンを放すと、ループ内に完全に入ったオブジェクトがすべて選択されます。" # mt
hintstep.freehand_pick.2 = "放すときに Alt キーを押していると、ループが触れたオブジェクトがすべて選択されます。" # mt
hintstep.freehand_pick.3 = "Shift キーを押すと選択に追加、Ctrl キーを押すとループの代わりに長方形をドラッグします。選択したオブジェクトは選択ツールと同じように移動やサイズ変更ができます。" # mt
hintstep.free_transform.1 = "オブジェクトを選択し、プロパティバーで自由回転を選んでドラッグします。押した点を中心にオブジェクトが回転します。" # mt
hintstep.free_transform.2 = "自由角度反転は、押した点からポインターまでの線を軸にオブジェクトを反転します。" # mt
hintstep.free_transform.3 = "自由拡大縮小は押した点を基準にサイズを変え、自由傾斜はオブジェクトを傾けます。" # mt
hintstep.free_transform.4 = "1 回のドラッグの間、Alt キーで拡大縮小、Ctrl キーで傾斜、Shift キーで反転になります。複製に適用がオンのときは、コピーが変形されます。" # mt
hintstep.shape.1 = "曲線をクリックするとノードが表示されます。ノードをドラッグすると移動します。" # mt
hintstep.shape.2 = "ノードをクリックするとコントロールハンドルが表示されます。ハンドルをドラッグすると曲線の曲がり具合が変わります。" # mt
hintstep.shape.3 = "セグメントをドラッグすると曲がります。直線のセグメントは曲線になります。" # mt
hintstep.shape.4 = "セグメントをダブルクリックするとそこにノードが追加され、ノードをダブルクリックすると削除されます。" # mt
hintstep.shape.5 = "長方形では角のノードをドラッグすると角が丸くなります。楕円ではノードを内側にドラッグすると扇形、外側にドラッグすると円弧になります。" # mt
hintstep.smooth.1 = "曲線を選択し、アウトラインに沿ってドラッグします。ブラシが通った部分の波打ちや余分なノードが滑らかになります。" # mt
hintstep.smooth.2 = "ペン先のサイズはブラシの半径を、レートは滑らかにする強さを決めます。効果はペン先の中心で最も強くなります。" # mt
hintstep.smear.1 = "オブジェクトを選択し、アウトラインの内側から外側へドラッグすると、出っ張りを引き出せます。" # mt
hintstep.smear.2 = "アウトラインの外側から内側へドラッグすると、へこみを押し込めます。" # mt
hintstep.smear.3 = "プロパティバーの筆圧はアウトラインが動く距離を、ペン先のサイズはブラシの半径を決めます。" # mt
hintstep.twirl.1 = "オブジェクトを選択し、ペン先を端に置いてマウスボタンを押し続けます。押している間、アウトラインが渦になって大きくなります。" # mt
hintstep.twirl.2 = "プロパティバーで時計回りか反時計回りを選ぶか、Alt キーを押して逆向きに回します。速度は回る速さを決めます。" # mt
hintstep.attract_repel.1 = "オブジェクトを選択し、ペン先をアウトラインに置いてマウスボタンを押し続けます。引き寄せはノードをポインターの方へ引き寄せます。" # mt
hintstep.attract_repel.2 = "押し出しを選ぶか Alt キーを押すと、ノードがポインターから遠ざかります。" # mt
hintstep.attract_repel.3 = "ペン先のサイズは変化する範囲を、速度は変化の速さを決めます。ポインターを止めたままでも効果は続きます。" # mt
hintstep.smudge.1 = "オブジェクトを選択し、アウトラインを横切るようにドラッグします。アウトラインがドラッグに合わせて滑らかに引っ張られます。" # mt
hintstep.smudge.2 = "筆圧はアウトラインを引っ張る距離を、ペン先のサイズはブラシの半径を決めます。" # mt
hintstep.roughen.1 = "オブジェクトを選択し、アウトラインに沿ってドラッグします。ドラッグした部分にギザギザのとげが現れます。" # mt
hintstep.roughen.2 = "周波数はとげの数を、とげの大きさはとげの高さを決めます。" # mt
