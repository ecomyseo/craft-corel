hinttopic.fill = "オブジェクトを均一な色、グラデーション、パターン、テクスチャ、メッシュで塗りつぶします。パレットの色を**クリック**すると選択範囲を塗りつぶします。"
hinttopic.help = "**F1** でヘルプ、作業中はこの**ヒント**パネルを開いたままにし、はじめにはようこそ画面をご覧ください。"
hinttopic.lines = "**曲線**ツールのフライアウトには、フリーハンドでも正確にも、直線でも曲線でも線を描くツールがあります。"
hinttopic.move_scale = "選択したオブジェクトをドラッグして移動します。**Ctrl** で水平または垂直に保ちます。**コーナー ハンドル**で縦横比を保って拡大縮小し、**サイド ハンドル**で伸縮します。**Shift** で中心から拡大縮小。矢印キーで少しずつ移動します。"
hinttopic.outline = "アウトラインの幅、色、スタイルを設定します。パレットの色を**右クリック**すると選択範囲のアウトラインに色を付けます。"
hinttopic.rotate_skew = "選択したオブジェクトをもう一度クリックすると回転と傾斜のハンドルが表示されます。**コーナーの矢印**で回転、**サイドの矢印**で傾斜。**Ctrl** で 15 度ずつ回転します。中心マーカーをドラッグして回転の中心を変えます。"
hinttopic.select = "オブジェクトをクリックして選択します。**Shift**+クリックで追加や解除、空いた場所をドラッグで範囲内を選択、**Alt**+クリックで下のオブジェクト、**Ctrl**+クリックでグループ内のオブジェクトを選択します。"
hinttopic.shape_objects = "ノードの編集、アウトラインの変形、切断や消去でオブジェクトの形を変えます。"
hinttopic.shapes = "対角線にドラッグして長方形、楕円、多角形、星形、スパイラル、グリッド、既製図形を描きます。**Ctrl** で縦横比を保ち、**Shift** で中心から描きます。"
hinttopic.text = "**テキスト**ツールでクリックすると美術テキスト、ドラッグするとフレーム内の段落テキストを追加します。テキスト内をクリックして編集します。"
