welcome.learn = "Apprendre"
welcome.learn_1_body = "Choisissez un outil dans la boîte à outils (maintenez un bouton pour ouvrir son menu contextuel) et faites glisser sur la page. Maintenez Ctrl pour contraindre, Maj pour dessiner à partir du centre."
welcome.learn_1_title = "Dessiner"
welcome.learn_2_body = "Cliquez pour sélectionner, cliquez de nouveau pour afficher les poignées de rotation et d'inclinaison, faites glisser les angles pour mettre à l'échelle. Les touches fléchées déplacent ; Maj+flèches déplacent dix fois plus loin."
welcome.learn_2_title = "Sélectionner et transformer"
welcome.learn_3_body = "Clic gauche sur une couleur de la palette pour le fond, clic droit pour le contour. Le panneau Propriétés modifie les dégradés, motifs, textures et maillages."
welcome.learn_3_title = "Surfaces et contours"
welcome.learn_4_body = "L'outil Forme (F10) modifie les noeuds : double-cliquez sur un segment pour ajouter un noeud, double-cliquez sur un noeud pour le supprimer, utilisez la barre de propriétés pour angulaire, lisse et symétrique."
welcome.learn_4_title = "Noeuds"
welcome.learn_5_body = "Les effets restent modifiables : ouvrez le panneau de l'effet depuis le menu Effets, changez les valeurs et l'objet se met à jour. Aplatir les effets les fige."
welcome.learn_5_title = "Effets"
welcome.my_templates = "Mes modèles"
welcome.new_document = "Nouveau document"
welcome.new_from_template = "Nouveau à partir d'un modèle"
welcome.news.more = "Envie d'en savoir plus ?" # mt
welcome.news.v0_32_body = "Vectoriser une image donne maintenant un résultat proche de l'original avec beaucoup moins d'objets, et un nouveau réglage Optimisé, utilisé par la Vectorisation rapide, choisit tout seul le bon niveau de détail pour chaque image. Sous macOS, un double-clic sur un dessin dans le Finder l'ouvre dans Craft Plumilla. Vous pouvez réordonner les onglets des panneaux en les faisant glisser et commencer une déformation n'importe où sur la page, et sur Android l'impression et le partage passent par le système. Les polices ajoutées dans le navigateur ou sur Android sont gardées pour la prochaine fois." # mt
welcome.news.v0_32_title = "Une vectorisation plus intelligente" # mt
welcome.news.v0_33_body = "L'enregistrement au format .cdr garde maintenant vos repères et enregistre le texte de paragraphe comme un vrai texte de paragraphe, et les deux reviennent quand le fichier est rouvert. Sur Android, les fonctions en ligne comme le dessin par IA et le téléchargement de dictionnaires fonctionnent, et toucher la page avec l'outil Texte fait apparaître le clavier à l'écran pour écrire dans n'importe quelle langue directement sur la page. Les images vectorisées s'emboîtent sans espace entre les couleurs, Réduire les nœuds garde les courbes fidèles à leur forme, et sous Linux une capture d'écran se colle du premier coup." # mt
welcome.news.v0_33_title = "Meilleur enregistrement .cdr et fonctions en ligne sur Android" # mt
welcome.news.v0_34_body = "Craft Plumilla vit désormais dans sa propre organisation sur GitHub : tous les liens vers le projet, ses téléchargements et la version navigateur pointent vers la nouvelle adresse. La boîte À propos et les programmes d'installation citent les membres et contributeurs de Craft Plumilla, et une courte mention précise que Craft Plumilla est un projet indépendant. Ouvrir un fichier PDF endommagé ne ferme plus le programme, et les contributeurs trouvent des règles plus claires sur le fonctionnement du projet." # mt
welcome.news.v0_34_title = "Une nouvelle maison pour le projet" # mt
welcome.news.v0_35_body = "La modernisation visuelle de l'espace de travail arrive au complet : de nouvelles icônes dans la boîte à outils dans un style net et unique, une nouvelle palette de couleurs par défaut aux noms de couleurs simples, des conseils plus courts et plus clairs dans la barre d'état et une barre de menus aux noms plus simples (Fichier, Édition, Affichage, Objet, Texte, Image, Effets, Page, Outils, Fenêtre, Aide). Vous pouvez importer un dessin Craft Plumilla dans un autre, Tab passe directement d'un champ numérique au suivant, et chaque page de la vue multipage affiche ses propres repères. Maintenir la barre d'espace ne laisse plus de copies égarées, et Alt+clic sélectionne en un seul clic une forme cachée derrière une autre." # mt
welcome.news.v0_35_title = "Un tout nouveau look" # mt
welcome.news.v0_36_body = "Cette version rend Craft Plumilla bien plus difficile à faire planter : les fichiers endommagés de nombreux types sont refusés ou ouverts sans risque au lieu de fermer le programme, et les dessins aux groupes imbriqués très profondément s'ouvrent de nouveau. Les contours variables font tout le tour des formes fermées, et sélectionner des nœuds avec un cadre dans l'outil Forme fonctionne comme prévu, même au-dessus d'autres objets. Dissocier, Séparer et le Couteau défont les cadres avec contenu sans perdre ce qu'ils contenaient. Les contours à coins arrondis sont plus doux, un raccourci donné à une commande est retiré à la commande qui l'avait, et l'Aperçu avant impression redimensionne la page uniformément depuis ses coins." # mt
welcome.news.v0_36_title = "Plus stable et plus précis" # mt
welcome.news.v0_37_body = "La modernisation visuelle de l'espace de travail apporte des icônes d'outils plus nettes et plus légères, bien lisibles à taille normale. La boîte à outils flottante se redimensionne et ses boutons se réorganisent pour tenir, et Ctrl avec la molette de la souris agrandit ou réduit les nuances de la palette et les boutons des barres. Les raccourcis de zoom fonctionnent pendant la saisie de texte, la Gomme agit sur les formes placées dans un cadre, et les lignes et colonnes d'un tableau se modifient depuis la barre de propriétés. Tourner la molette sur un champ numérique ne remplit plus la liste Annuler, la vectorisation de cliparts donne des résultats plus propres, et sous macOS quitter demande avant de perdre le travail non enregistré." # mt
welcome.news.v0_37_title = "Icônes plus nettes et édition plus fluide" # mt
welcome.news.v0_38_body = "Vous pouvez maintenant ouvrir plusieurs palettes de couleurs en même temps, chacune dans sa propre barre, ancrée sur n'importe quel bord de la fenêtre ou flottante, et le Gestionnaire de palettes a une présentation plus claire. La modernisation visuelle de l'espace de travail continue : les icônes de la boîte à outils et des barres grandissent avec la taille de bouton choisie, en cinq tailles. Le texte de paragraphe se recompose pendant que vous redimensionnez son cadre, les poignées de déformation sont plus faciles à voir, et vous pouvez choisir l'espace entre les pages dans la vue multipage. Les dégradés et les objets transparents des fichiers .cdr s'ouvrent tels qu'ils ont été créés, et les fichiers PDF gardent leurs traits de coupe, leurs tons directs et leurs formes découpées." # mt
welcome.news.v0_38_title = "Plusieurs palettes à la fois" # mt
welcome.news.v0_39_body = "Dans le navigateur, le stylet d'une tablette graphique trace des lignes plus épaisses ou plus fines selon la force avec laquelle vous appuyez, et sous Linux vous pouvez de nouveau glisser des fichiers depuis le gestionnaire de fichiers vers la fenêtre. Vous pouvez créer vos propres palettes de couleurs et afficher chacune dans sa propre barre. Les étoiles peuvent être retournées vers l'intérieur, les coins arrondis des rectangles peuvent être bien plus grands quand il y a la place, et la conversion en bitmap en niveaux de gris ou en CMJN donne vraiment ce type d'image. Les fichiers .cdr avec enveloppes et dégradés ressemblent davantage à l'original, et sous Windows le programme d'installation demande dans quelle langue Craft Plumilla doit parler." # mt
welcome.news.v0_39_title = "Pression du stylet dans le navigateur et palettes personnelles" # mt
welcome.news.v0_40_body = "TraceCut est une nouvelle fenêtre pour les traceurs de découpe : envoyez votre dessin au traceur, ajoutez des lignes de coupe, imbriquez les formes sur une feuille ou un rouleau pour économiser la matière, et mesurez-les. Les menus et les listes fonctionnent désormais au clavier. Sur les téléphones Android, l'interface tient sur l'écran, et une main posée sur l'écran ne dessine plus pendant que vous utilisez un stylet. Le stylet d'une tablette graphique fonctionne sous Linux avec Wayland. Les fichiers .cdr s'ouvrent avec leurs taquets de tabulation, leurs pages maîtres, leurs dégradés et leurs déformations, et les fichiers .cdr avec du texte que vous enregistrez s'ouvrent de nouveau dans d'autres programmes. Les images des fichiers PDF arrivent en pleine résolution, JPEG et TIFF peuvent être exportés en CMJN, les images peuvent être enregistrées dans leur propre format, et de nombreux outils fonctionnent mieux." # mt
welcome.news.v0_40_title = "TraceCut pour les traceurs de découpe" # mt
welcome.news.v0_41_body = "Sur les écrans tactiles, des boutons Maj, Ctrl et Alt permettent au doigt de faire ce que font les touches maintenues, et les raccourcis Alt ouvrent chaque menu, même dans une fenêtre étroite. Sous Android, l'interface évite l'encoche de la caméra et les coins arrondis, et la fusion de données peut utiliser un dossier d'images ; dans le navigateur, l'Apple Pencil fonctionne dans Safari sur iPad, et le WebP peut être enregistré avec perte pour des fichiers plus petits. Les fichiers .cdr gardent la règle de remplissage des courbes qui se chevauchent, si bien que les lettrages vectorisés ne montrent plus de trous blancs, et s'ouvrent avec leurs taquets de tabulation, leur texte sur plusieurs colonnes, les repères communs à toutes les pages et les objets de la page maître. Les fichiers importés se placent avec un curseur, Répéter rejoue tout un groupe d'actions, et les points d'une B-spline peuvent être fixes ou flottants. Vous pouvez recadrer les pixels d'une image, imprimer en niveaux de gris ou dans l'ordre inverse dans les vraies marges de l'imprimante, et les images CMJN gardent leur transparence. Les barres de défilement peuvent être masquées, une palette peut prendre ses couleurs dans une image, et sous Windows la barre de titre suit un thème sombre." # mt
welcome.news.v0_41_title = "Touches tactiles, meilleurs fichiers .cdr et recadrage des images" # mt
