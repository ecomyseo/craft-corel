web.notice_title = "Craft Plumilla dans votre navigateur"
web.notice_text = "**Un navigateur est plus lent :** les grands dessins, les effets lourds et les gros fichiers prennent plus de temps, seules les polices fournies sont disponibles, et les fichiers s'ouvrent par envoi et s'enregistrent en téléchargements.\n\nC'est le même programme Rust que l'application de bureau, compilé en WebAssembly pour l'essayer sans rien installer.\n\nPour le vrai travail et les gros fichiers, utilisez l'application pour Windows, macOS ou Linux : elle tourne en natif, à pleine vitesse."
